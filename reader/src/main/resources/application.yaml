info:
  app:
    name: @project.name@
    version: @project.version@

spring:
  config:
    import: classpath:/base-config-application.yaml

  threads.virtual.enabled: true

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    open-in-view: false

  datasource:
    driverClassName: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    hikari:
      minimum-idle: 2
      maximum-pool-size: 10

fss:
  reader:
    server-url: ${EXTERNAL_SERVER_URL:http://localhost:${server.port:8080}}
    context-path: ${API_ENTRYPOINT:/}
  search:
    max-page-size: 200
    default-page-size: 50
    ignored-params:
      - _summary
      - _elements
      - _total
      - _pretty
  security:
    role-profile-mapping:
      bed-occupancy-fetcher: "https://demis.rki.de/fhir/StructureDefinition/ReportBundle"
      disease-notification-fetcher: "https://demis.rki.de/fhir/StructureDefinition/NotificationBundleDisease"
      igs-notification-data-fetcher: "https://demis.rki.de/fhir/igs/StructureDefinition/NotificationBundleSequence"
      pathogen-notification-fetcher: "https://demis.rki.de/fhir/StructureDefinition/NotificationBundleLaboratory"
      proof-of-disease-notification-excerpt-fetcher: "https://demis.rki.de/fhir/StructureDefinition/NotificationBundleDisease"
      proof-of-pathogen-notification-excerpt-fetcher: "https://demis.rki.de/fhir/StructureDefinition/NotificationBundleLaboratory"
      pathogen-notification-nonnominal-fetcher: "https://demis.rki.de/fhir/StructureDefinition/NotificationBundleLaboratoryNonNominal"
      pathogen-notification-anonymous-fetcher: "https://demis.rki.de/fhir/StructureDefinition/NotificationBundleLaboratoryAnonymous"
      pathogen-notification-negative-fetcher: "https://demis.rki.de/fhir/StructureDefinition/NotificationBundleLaboratoryNegative"
      disease-notification-nonnominal-fetcher: "https://demis.rki.de/fhir/StructureDefinition/NotificationBundleDiseaseNonNominal"
      disease-notification-anonymous-fetcher: "https://demis.rki.de/fhir/StructureDefinition/NotificationBundleDiseaseAnonymous"
      ars-data-fetcher: "https://demis.rki.de/fhir/ars/StructureDefinition/Bundle"

base:
  fhir:
    enabled: true
    error-as-operation-outcome: true
  error:
    sender:
      log: true

